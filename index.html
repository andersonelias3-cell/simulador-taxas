<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Taxas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: coluna única — campos no topo, tabela de parcelas abaixo */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14202b; --muted:#5b6b78; --line:#dbe2e8;
  --accent:#0b6e8a; --accent-ink:#ffffff; --accent-soft:#e2f1f5;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --surface:#17212a; --fg:#e6edf2; --muted:#93a4b1; --line:#2a3743;
  --accent:#4fb7d4; --accent-ink:#06222b; --accent-soft:#163541; color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-block:max(24px,env(safe-area-inset-top,0px)) max(48px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.field span{padding:0 10px;color:var(--muted);font-family:var(--font-num);font-size:14px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:600 18px var(--font-num);padding:12px 12px 12px 0;text-align:right}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.summary div{display:grid;gap:2px}
.summary small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.summary b{font:600 18px var(--font-num);font-variant-numeric:tabular-nums}
.summary .hl b{color:var(--accent)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-num);font-size:14px;white-space:nowrap}
td.big{font-weight:600;font-size:15px}
tr.debit td{background:var(--accent-soft)}
tbody tr:hover td{background:var(--accent-soft)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h2{font-size:16px;margin:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{font:inherit;font-weight:600;font-size:15px;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600}
textarea{width:100%;min-height:160px;font:13px var(--font-num);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Simulador de Taxas</h1>
    <p>Informe o valor e a entrada para ver as opções no débito e no cartão de 1x a 18x.</p>
  </header>

  <div class="card">
    <div class="seg" role="group" aria-label="Tipo de aparelho">
      <button type="button" id="btn-novo" data-tipo="novo" aria-pressed="true">iPhone Novo</button>
      <button type="button" id="btn-seminovo" data-tipo="seminovo" aria-pressed="false">iPhone Seminovo</button>
    </div>
    <div class="grid">
      <label for="valor">Valor a parcelar<div class="field"><span>R$</span><input id="valor" inputmode="decimal" value="3.000,00"></div></label>
      <label for="entrada">Valor de entrada<div class="field"><span>R$</span><input id="entrada" inputmode="decimal" value="0,00"></div></label>
    </div>
    <div class="summary">
      <div><small>Entrada</small><b id="out-entrada">–</b></div>
      <div class="hl"><small>Saldo a parcelar</small><b id="out-saldo">–</b></div>
    </div>
  </div>

  <div class="card">
    <div class="bar"><h2>Opções de pagamento</h2><button class="btn" id="copiar">Copiar para WhatsApp</button></div>
    <div class="tablebox"><table><thead><tr><th>Parcelas</th><th>Valor da parcela</th><th>Valor total</th></tr></thead><tbody id="tabela"></tbody></table></div>
  </div>

  <div id="copybox" class="card" hidden>
    <div class="bar"><h2>Texto da simulação</h2><button class="btn ghost" id="fechar">Fechar</button></div>
    <textarea id="copytext" readonly></textarea>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== CONFIGURAÇÃO INTERNA (não aparece na tela) ===== */
const CONFIG = {
  // iPhone NOVO: só a taxa da maquininha, sem Simples
  novo: {
    nome: 'iPhone Novo',
    simples: 0,             // % Simples Nacional sobre o valor
    simplesAcrescimo: 0,    // % Simples sobre o acréscimo da taxa
    debito: 0.99,           // % taxa do débito
    // % taxa de 1x a 18x
    parcelas: [2.99,5.30,5.30,6.15,7.00,7.85,8.29,9.14,9.99,10.84,11.69,12.54,13.29,14.09,14.89,15.69,16.49,17.29]
  },
  // iPhone SEMINOVO: taxas da planilha, com Simples Nacional
  seminovo: {
    nome: 'iPhone Seminovo',
    simples: 3.11,
    simplesAcrescimo: 3.11,
    debito: 0.99,
    parcelas: [3.05,4.45,5.3,6.15,7,7.85,8.29,9.14,9.99,10.84,11.69,12.54,13.29,14.09,14.89,15.69,16.49,17.29]
  }
};
let tipo = 'novo';
/* ====================================================== */

const $ = id => document.getElementById(id);
const brl = v => isFinite(v) ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '–';
function num(id){
  let s = String($(id).value).trim().replace(/[^\d,.\-]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}

let ultimo = null;
function calcular(){
  const valor = num('valor');
  const entrada = Math.max(0, num('entrada'));
  // 1) abate a entrada  2) aplica o Simples  3) aplica a taxa da maquininha
  const saldo = Math.max(0, valor - entrada);
  const cfg = CONFIG[tipo];
  const base = saldo / (1 - cfg.simples/100);

  const debito = base / (100 - cfg.debito) * 100;
  const linhas = cfg.parcelas.map((taxa, i) => {
    const bruto = base / (100 - taxa) * 100;
    const total = bruto + (bruto - base) * cfg.simplesAcrescimo/100;
    return {n:i+1, total, parcela: total/(i+1)};
  });

  $('out-entrada').textContent = brl(entrada);
  $('out-saldo').textContent = brl(saldo);
  let h = `<tr class="debit"><td>Débito</td><td class="big">${brl(debito)}</td><td>${brl(debito)}</td></tr>`;
  for(const l of linhas) h += `<tr><td>${l.n}x</td><td class="big">${brl(l.parcela)}</td><td>${brl(l.total)}</td></tr>`;
  $('tabela').innerHTML = h;
  ultimo = {nome: cfg.nome, entrada, debito, linhas};
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1800); }
$('copiar').addEventListener('click',()=>{
  const s = ultimo; let txt = `*Simulação de pagamento – ${s.nome}*\n`;
  if(s.entrada>0) txt += `Entrada: ${brl(s.entrada)}\n`;
  txt += `Débito: ${brl(s.debito)}\n`;
  s.linhas.forEach(l=> txt += `${l.n}x de ${brl(l.parcela)} (total ${brl(l.total)})\n`);
  const mostrar = ()=>{ $('copytext').value = txt; $('copybox').hidden=false; $('copytext').select(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Simulação copiada'), ()=>{ mostrar(); toast('Selecione e copie o texto abaixo'); });
  } else mostrar();
});
$('fechar').addEventListener('click',()=>$('copybox').hidden=true);
document.querySelectorAll('[data-tipo]').forEach(b => b.addEventListener('click', () => {
  tipo = b.dataset.tipo;
  document.querySelectorAll('[data-tipo]').forEach(x => x.setAttribute('aria-pressed', x === b));
  calcular();
}));
document.addEventListener('input', calcular);
calcular();
</script>
</body>
</html>
